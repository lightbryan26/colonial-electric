name: Pages link check
# After every deploy of docs/ to GitHub Pages: wait until the live site serves this commit's build, then all 45
# sitemap slugs must return 200 on the Pages URL and a full crawl (tools/linkcheck.mjs) must find zero broken
# pages, assets or links. (GitHub's built-in "pages build and deployment" run does not fire workflow_run events,
# so this listens for the push itself and polls for the deploy.)
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages-linkcheck.yml']
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      BASE: https://lightbryan26.github.io/colonial-electric/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for GitHub Pages to serve this build
        run: |
          want=$(md5sum docs/assets/site.css | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got=$(curl -s "${BASE}assets/site.css?nocache=$RANDOM" | md5sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && { echo "live after $((i*10))s"; exit 0; }
            sleep 10
          done
          echo "Pages did not serve this build within 10 minutes"; exit 1
      - name: Install Playwright
        working-directory: tools
        run: npm ci && npx playwright install --with-deps chromium
      - name: Every sitemap slug returns 200 on GitHub Pages
        run: |
          fail=0; n=0
          while IFS= read -r slug; do   # the homepage's slug is empty, so read lines rather than split words
            n=$((n+1)); code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$BASE$slug")
            echo "$code $BASE$slug"; [ "$code" = 200 ] || fail=1
          done < <(grep -o '<loc>[^<]*' docs/sitemap.xml | sed 's#<loc>https://colonial-electric.com/##')
          echo "$n slugs checked"; [ "$n" = 45 ] || fail=1; exit $fail
      - name: Crawl for broken links
        run: node tools/linkcheck.mjs "$BASE"
