<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Colonial Electric · Build Progress</title>
<style>
:root{--navy:#12233E;--ink:#081020;--red:#BF1B2C;--paper:#F6F7F9;--line:#dde2ea}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:28px 20px;border-bottom:6px solid var(--red)}
header h1{margin:0;font-size:26px;letter-spacing:.02em}header p{margin:4px 0 0;opacity:.8}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:16px}.card img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.pill{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:#e8ecf2;color:var(--navy)}
.won,.done{background:#1f7a3a;color:#fff}.lost,.failed{background:var(--red);color:#fff}.building,.critiquing,.verifying{background:#1E4479;color:#fff}
.note{color:#3a4659;font-size:14px}.meta{color:#6b7689;font-size:12px}
h2{margin:28px 0 12px;font-size:18px}ol{list-style:none;padding:0;margin:0}ol li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
a{color:var(--navy)}.bar{height:8px;background:#e8ecf2;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--red)}
</style></head><body>
<header><h1>Colonial Electric rebuild: live build progress</h1><p id="sub">Loading…</p><div class="bar"><i id="bar" style="width:0"></i></div></header>
<main><p>Each piece loops builder → blind critic (vs. the Dribbble reference) until the critic picks ours. Images show the latest blind A/B comparison. Site preview: <a href="../">lightbryan26.github.io/colonial-electric/</a></p>
<h2>Pieces</h2><div class="grid" id="pieces"></div><h2>Activity</h2><ol id="events"></ol></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const d=await (await fetch('progress.json?'+Date.now())).json();
const ps=Object.entries(d.pieces);const won=ps.filter(([,p])=>p.status==='won'||p.status==='done').length;
document.getElementById('sub').textContent=`${won}/${ps.length} pieces passed · last update ${new Date(d.updated).toLocaleString()}`;
document.getElementById('bar').style.width=(ps.length?won/ps.length*100:0)+'%';
document.getElementById('pieces').innerHTML=ps.map(([k,p])=>`<div class="card"><h3>${esc(k)}</h3><div><span class="pill ${esc(p.status)}">${esc(p.status)}</span> <span class="meta">round ${p.round}</span></div><div class="note">${esc(p.note)}</div>${p.shot?`<a href="${esc(p.shot)}" target="_blank"><img loading="lazy" src="${esc(p.shot)}" alt="blind comparison"></a>`:''}<div class="meta">${new Date(p.updated).toLocaleTimeString()}</div></div>`).join('');
document.getElementById('events').innerHTML=d.events.slice(0,80).map(e=>`<li><span class="pill ${esc(e.status)}">${esc(e.status)}</span> <b>${esc(e.piece)}</b> r${e.round}: ${esc(e.note)} <span class="meta">${new Date(e.t).toLocaleTimeString()}</span></li>`).join('');
}catch(e){document.getElementById('sub').textContent='No progress yet'}}
load();setInterval(load,15000);
</script></body></html>
